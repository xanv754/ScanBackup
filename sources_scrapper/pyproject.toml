[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapper_scanbackup"
version = "0.1.0"
description = "Sistema para obtención de enlaces de la plataforma SCAN"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Angyee Marin", email = "angyeemarin.dev@gmail.com" }
]
keywords = ["grd", "network", "data-processing"]
dependencies = [
    "art>=6.4",
    "beautifulsoup4>=4.13",
    "click>=8.1.8",
    "html5lib>=1.1",
    "openpyxl>=3.1.5",
    "pandas>=1.3.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "rich>=13.9.4",
]
urls = { Homepage = "https://github.com/xanv754/SystemCGPRD" }

[project.scripts]
scanbackup = "scrapper_scanbackup.__main__:cli"

[project.optional-dependencies]
dev = ["black"]

[tool.setuptools]
packages = ["scrapper_scanbackup"]
