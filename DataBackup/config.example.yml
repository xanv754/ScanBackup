layers:
  bbip:
    schema_collection: "BBIP"
    names:
      - "example"
  ip:
    schema_collection: "IP"
    names:
      - "example"

database:
  host: "localhost"
  port: "27017"
  name: "scanbackup_db"
  user: "user"
  password: "password"

metadata:
  dir_data: "data"

  logs:
    dir_name: "logs"
    filename: "scanbackup"
    extension: "log"
    msg_format: "%(asctime)s %(levelname)s %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"

  scanner:
    file_delimiter: ";"
    max_workers: 5
    scan_credentials:
      username: "username"
      password: "password"

  reports:
    preffix_name: "ScanBackup"
    date_format: "%Y%m%d_%H%M%S"
