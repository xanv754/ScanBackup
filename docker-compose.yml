name: scan-backup

x-service-defaults: &service-defaults
  restart: "no"
  depends_on:
    mongo:
      condition: service_healthy
  networks:
    - scan-backup
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-mongo-env: &mongo-env
  MONGO_HOST: mongo
  MONGO_PORT: 27017
  MONGO_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
  MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
  MONGO_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
  MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}

x-scan-env: &scan-env
  SCAN_USERNAME: ${SCAN_USERNAME:?SCAN_USERNAME is required}
  SCAN_PASSWORD: ${SCAN_PASSWORD:?SCAN_PASSWORD is required}

services:
  mongo:
    image: mongo:8.0
    container_name: scan-backup-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      TZ: America/Caracas
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - scan-backup

  interface-sync:
    <<: *service-defaults
    profiles: ["services"]
    build:
      context: ./services/interface-sync
      target: prod
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: scan-backup/interface-sync:prod
    environment:
      <<: [*mongo-env, *scan-env]
      CONFIG_PATH: /app/config.yml
    volumes:
      - ./services/interface-sync/config.yml:/app/config.yml:ro
      - ./logs/interface-sync:/logs
    logging: *default-logging

  traffic-collector:
    <<: *service-defaults
    profiles: ["services"]
    build:
      context: ./services/traffic-collector
      target: prod
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: scan-backup/traffic-collector:prod
    environment:
      <<: [*mongo-env, *scan-env]
    volumes:
      - ./logs/traffic-collector:/logs
    logging: *default-logging

  reports:
    <<: *service-defaults
    profiles: ["services"]
    build:
      context: ./services/reports
      target: prod
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: scan-backup/reports:prod
    environment:
      <<: *mongo-env
      CONFIG_PATH: /app/config.yml
    volumes:
      - ./services/reports/config.yml:/app/config.yml:ro
      - ./logs/reports:/logs
      - ./exports:/exports
    logging: *default-logging

networks:
  scan-backup:
    name: scan-backup

volumes:
  mongo-data:
    name: scan-backup-mongo-data