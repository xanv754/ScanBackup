x-database: &database
  SCANBACKUP_DB_NAME: scanbackup_db
  SCANBACKUP_DB_USER: scanner
  SCANBACKUP_DB_PASSWORD: change-me

services:
  mongodb:
    image: mongo:7
    container_name: scanbackup-mongodb
    restart: unless-stopped
    environment:
      <<: *database
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: change-me-root
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    configs:
      - source: init-mongo
        target: /docker-entrypoint-initdb.d/init-mongo.js
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scanbackup

  databackup:
    build:
      context: ./DataBackup
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: scanbackup-databackup
    container_name: scanbackup-databackup
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      <<: *database
      SCANBACKUP_DB_HOST: mongodb
      SCANBACKUP_DB_PORT: 27017
    volumes:
      - ./DataBackup/config.yml:/app/config.yml:ro
      - ./DataBackup/data:/app/data
    networks:
      - scanbackup

  sourcescrapper:
    build:
      context: ./SourceScrapper
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: scanbackup-sourcescrapper
    container_name: scanbackup-sourcescrapper
    volumes:
      - ./SourceScrapper/config.yml:/app/config.yml:ro
      - ./SourceScrapper/data:/app/data
    networks:
      - scanbackup
    command: ["--help"]

configs:
  init-mongo:
    content: |
      const env = process.env;
      db.getSiblingDB(env.SCANBACKUP_DB_NAME).createUser({
        user: env.SCANBACKUP_DB_USER,
        pwd: env.SCANBACKUP_DB_PASSWORD,
        roles: [{ role: "readWrite", db: env.SCANBACKUP_DB_NAME }],
      });

networks:
  scanbackup:
    driver: bridge

volumes:
  mongodb_data:
