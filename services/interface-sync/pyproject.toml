[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "interface_sync"
version = "3.0.0"
description = "Interface Synchronization System for the Network"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Angyee Marin", email = "angyeemarin.dev@gmail.com" }
]
keywords = ["grd", "network", "data-processing"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "click>=8.1.8",
    "html5lib>=1.1",
    "pydantic>=2.10.6",
    "pymongo>=4.11.3",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "rich>=13.9.4",
]

[project.urls]
Homepage = "https://github.com/xanv754/ScanBackup"

[project.scripts]
interface_sync = "interface_sync.__main__:cli"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]
dev = [
    "interface_sync[test]",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["interface_sync*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that require a running MongoDB instance",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ERA", "PT", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["interface_sync"]
